<!doctype html>
<html lang="en" style="background-color: #fff">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3D1640" />
    <meta name="description" content="Civil Service Exam (Professional) reviewer: lessons with love analogies, endless Numerical practice, and full mock exams." />
    <title>Kilig CSE Reviewer</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #boot { position: fixed; inset: 0; z-index: 999; background: #fff; }
    </style>
  </head>
  <body>
    <div id="boot"></div>
    <div id="root"></div>
    <!-- Lets the host recognize the in-app feedback form. The app sends it with fetch. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input name="rating" />
      <textarea name="message"></textarea>
      <input name="where" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
